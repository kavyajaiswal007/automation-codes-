name: Daily Coding Log

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          echo "Coding activity: $(date -u '+%Y-%m-%d')" >> daily-log.txt

      - name: Commit changes
        run: |
          git config user.name "kavya-jaiswal"
          git config user.email "creativekavya007@gmail.com"
          git add daily-log.txt
          git commit -m "chore: daily coding log" || exit 0
          git push
